name: Update Hugging Face download statistics

on:
  schedule:
    # 09:00 Asia/Yekaterinburg (UTC+05:00)
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hf-download-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update downloads from Hugging Face API
        run: python .github/scripts/update_hf_downloads.py

      - name: Commit changes if counts changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No README changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh Hugging Face all-time downloads"
          git push
